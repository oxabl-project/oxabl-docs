name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  # The skill sync workflow starts it on bot/sync-skill, whose PR GITHUB_TOKEN cannot trigger.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build, and deploy from main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # After the build, which writes the lint rules to .nimbus/lint.json.
      - run: npm run lint:docs
      - run: npm run seo:check
      # Offline: the vendored skill is consistent and the pages name files it has.
      - run: npm run skill:test
      - run: npm run skill:check
      # The Worker serves the pre-built pages as static assets and runs only for /mcp.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Check what docs.oxabl.org serves
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-seo.mjs --live
